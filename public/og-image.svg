<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Niklas Kost portfolio preview</title>
  <desc id="desc">Dark cinematic orbital field artwork with Niklas Kost portfolio typography.</desc>
  <defs>
    <radialGradient id="core" cx="54%" cy="49%" r="52%">
      <stop offset="0" stop-color="#f2f0e9" stop-opacity="0.72" />
      <stop offset="0.12" stop-color="#e8a15b" stop-opacity="0.34" />
      <stop offset="0.32" stop-color="#7aa7ff" stop-opacity="0.14" />
      <stop offset="1" stop-color="#020205" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueWake" cx="30%" cy="62%" r="72%">
      <stop offset="0" stop-color="#7aa7ff" stop-opacity="0.26" />
      <stop offset="0.35" stop-color="#7567d8" stop-opacity="0.12" />
      <stop offset="1" stop-color="#020205" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f0e9" stop-opacity="0" />
      <stop offset="0.42" stop-color="#f2f0e9" stop-opacity="0.58" />
      <stop offset="0.58" stop-color="#7aa7ff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#f2f0e9" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="field" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="18" r="1.2" fill="#f2f0e9" opacity="0.34" />
      <circle cx="62" cy="30" r="0.8" fill="#7aa7ff" opacity="0.28" />
      <circle cx="92" cy="86" r="1.1" fill="#f2f0e9" opacity="0.22" />
      <circle cx="38" cy="98" r="0.7" fill="#e8a15b" opacity="0.28" />
    </pattern>
    <mask id="fadeEdges">
      <rect width="1200" height="630" fill="white" />
      <rect width="1200" height="120" fill="url(#edgeFade)" />
    </mask>
    <linearGradient id="edgeFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="black" />
      <stop offset="1" stop-color="white" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#020205" />
  <rect width="1200" height="630" fill="url(#field)" opacity="0.42" />
  <rect width="1200" height="630" fill="url(#blueWake)" />
  <ellipse cx="662" cy="310" rx="468" ry="238" fill="url(#core)" opacity="0.75" />

  <g filter="url(#softGlow)" fill="none" stroke-linecap="round">
    <path d="M-90 482 C210 340 402 585 670 350 C892 154 1042 144 1300 72" stroke="url(#arc)" stroke-width="2.5" opacity="0.74" />
    <path d="M-60 238 C210 380 390 292 602 220 C832 140 1002 310 1280 194" stroke="#f2f0e9" stroke-width="1.2" opacity="0.2" />
    <path d="M46 620 C245 420 458 390 650 314 C870 226 1030 92 1214 -70" stroke="#7aa7ff" stroke-width="1.4" opacity="0.22" />
    <path d="M348 -80 C444 112 398 224 508 338 C644 478 834 506 1288 438" stroke="#f2f0e9" stroke-width="1.1" opacity="0.18" />
  </g>

  <g opacity="0.9">
    <circle cx="642" cy="313" r="4" fill="#f2f0e9" />
    <circle cx="642" cy="313" r="18" fill="none" stroke="#e8a15b" stroke-opacity="0.42" />
    <circle cx="642" cy="313" r="46" fill="none" stroke="#7aa7ff" stroke-opacity="0.12" />
  </g>

  <g font-family="Inter, Geist, Arial, sans-serif" fill="#f2f0e9">
    <text x="76" y="92" font-size="18" letter-spacing="5" opacity="0.58">PORTFOLIO / 2026</text>
    <text x="72" y="350" font-size="92" font-weight="700" letter-spacing="0" filter="url(#textGlow)">NIKLAS KOST</text>
    <text x="78" y="402" font-size="24" letter-spacing="6" opacity="0.72">COMPUTER SCIENCE / LMU MUNICH</text>
    <text x="80" y="500" font-size="18" letter-spacing="4" opacity="0.52">SYSTEMS / CYBERSECURITY / SOFTWARE</text>
  </g>

  <g font-family="IBM Plex Mono, Consolas, monospace" fill="#8c9099" opacity="0.72">
    <text x="862" y="532" font-size="14" letter-spacing="2">NIKLAS KOST | PORTFOLIO</text>
    <text x="862" y="556" font-size="12" letter-spacing="2">FIELD: ACTIVE / SIGNAL: RESOLVED</text>
  </g>
</svg>
